<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAA Salons — Services & Prices</title>
<meta name="description" content="VAA Salons — full service menu with transparent prices. Book directly on WhatsApp.">
<meta name="theme-color" content="#0a0e1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,Arial,sans-serif;background:#0a0e1a;color:#f5f5f5;-webkit-tap-highlight-color:transparent;line-height:1.55;padding-top:44px;padding-bottom:100px}
a{text-decoration:none;color:inherit}
:root{--gold:#ffd400;--gold-2:#e6b800;--blue:#4f8fff;--pink:#ec4899;--purple:#a855f7;--card:#12192a;--card-2:#0d1220;--line:rgba(255,212,0,.15);--line-soft:rgba(255,255,255,.08);--white:#f5f5f5;--muted:#8a8f9c;--green:#25b46e;--red:#e11d2a}

/* DEMO BANNER */
.demo-banner{position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(90deg,#ffd400,#ffa726);color:#0a0e1a;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;font-weight:850}
.demo-banner-txt{display:flex;align-items:center;gap:8px}
.demo-banner .dot{width:8px;height:8px;background:#0a0e1a;border-radius:50%;animation:pulseDot 1.5s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}
.demo-banner a{background:#0a0e1a;color:var(--gold);padding:6px 12px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.5px;white-space:nowrap}
.demo-banner .close{background:transparent;border:0;color:#0a0e1a;font-size:18px;cursor:pointer;padding:2px 6px;font-weight:900}

/* HEADER */
header{padding:44px 20px 30px;text-align:center;position:relative;border-bottom:1px solid var(--line-soft);background:radial-gradient(ellipse at 50% 0%,rgba(255,212,0,.12),transparent 60%),linear-gradient(180deg,#0a0e1a,#0f1520)}
.logo{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(145deg,#1a2136,#0d1220);border:2px solid rgba(255,212,0,.5);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 50px rgba(255,212,0,.25)}
.brand{font-size:clamp(28px,5vw,42px);font-weight:950;letter-spacing:-1.5px;line-height:1;color:var(--white)}
.brand .gold{color:var(--gold)}
.tagline{color:var(--muted);font-size:11px;letter-spacing:4px;font-weight:900;margin-top:10px;text-transform:uppercase}
.status{display:inline-flex;align-items:center;gap:6px;background:rgba(37,180,110,.12);color:var(--green);padding:7px 14px;border-radius:99px;font-size:11px;font-weight:850;margin-top:16px;letter-spacing:.5px}
.status::before{content:"";width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.meta{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.instagram-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#ec4899,#a855f7);color:white;padding:9px 18px;border-radius:99px;font-size:12px;font-weight:900;letter-spacing:.5px;margin-top:18px;box-shadow:0 8px 20px rgba(236,72,153,.3);transition:.2s}
.instagram-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(236,72,153,.4)}

/* FILTERS */
.filters-sticky{position:sticky;top:44px;z-index:100;background:rgba(10,14,26,.98);backdrop-filter:blur(20px);border-bottom:1px solid var(--line-soft);padding:14px 0;margin-top:20px}
.filters-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 16px}
.cat-btn{background:var(--card);border:1px solid var(--line-soft);color:var(--white);padding:10px 18px;border-radius:99px;font-weight:850;font-size:12px;font-family:inherit;cursor:pointer;transition:.2s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.cat-btn:hover{border-color:var(--gold)}
.cat-btn.active{background:linear-gradient(135deg,var(--gold),#ffa726);color:#0a0e1a;border-color:var(--gold);box-shadow:0 8px 24px rgba(255,212,0,.3)}

/* MAIN */
main{max-width:900px;margin:0 auto;padding:30px 20px 0}
.cat-section{margin-bottom:44px}
.cat-header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.cat-header .icon{font-size:26px}
.cat-header h2{font-size:22px;font-weight:950;letter-spacing:-.8px;color:var(--gold);text-transform:uppercase;font-size:15px;letter-spacing:4px}
.cat-header .count{background:var(--card);border:1px solid var(--line-soft);color:var(--muted);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:900}
.cat-header .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line-soft),transparent)}

.service-list{display:grid;gap:10px}
.service-row{background:var(--card);border:1px solid var(--line-soft);border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;transition:.25s;position:relative;overflow:hidden}
.service-row:hover{border-color:rgba(255,212,0,.35);transform:translateY(-2px)}
.service-row.bestseller{border-color:rgba(255,212,0,.4);background:linear-gradient(145deg,#1a2136,#0d1220)}
.service-row.bestseller::before{content:"⭐ BESTSELLER";position:absolute;top:0;right:0;background:var(--gold);color:#0a0e1a;font-size:9px;font-weight:900;letter-spacing:1px;padding:4px 10px;border-bottom-left-radius:10px}

.svc-info{flex:1;min-width:0}
.svc-name{font-size:16px;font-weight:850;letter-spacing:-.3px;margin-bottom:5px}
.svc-desc{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:6px}
.svc-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.svc-meta .duration{background:rgba(79,143,255,.12);color:#8bb4ff;padding:3px 8px;border-radius:99px;font-size:10px}

.svc-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0}
.svc-price{font-size:22px;font-weight:950;color:var(--gold);letter-spacing:-1px;white-space:nowrap;line-height:1}
.svc-book{background:linear-gradient(135deg,#25b46e,#1a8f56);color:white;border:0;padding:9px 16px;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.svc-book:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,180,110,.3)}
.svc-book:active{transform:none}

/* LOADING */
.loading-state{padding:80px 20px;text-align:center;color:var(--muted)}
.spinner{width:44px;height:44px;border:3px solid rgba(255,212,0,.1);border-top-color:var(--gold);border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* BOTTOM BAR */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,26,.98);backdrop-filter:blur(20px);border-top:1px solid var(--line-soft);padding:14px 20px;display:flex;gap:10px;z-index:500}
.bottom-bar a{flex:1;padding:14px;border-radius:12px;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-family:inherit;transition:.2s;letter-spacing:.5px}
.bottom-bar .call{background:var(--card);color:var(--white);border:1px solid var(--line-soft)}
.bottom-bar .wa{background:linear-gradient(135deg,#25b46e,#1a8f56);color:white;box-shadow:0 8px 25px rgba(37,180,110,.3)}
.bottom-bar a:active{transform:scale(.98)}

/* FOOTER */
footer{text-align:center;padding:40px 20px 30px;color:var(--muted);font-size:11px;line-height:1.7;border-top:1px solid var(--line-soft);margin-top:40px}
footer b{color:var(--gold)}
footer a{color:var(--gold);border-bottom:1px solid rgba(255,212,0,.4)}
footer .powered{margin-top:12px;font-size:10px;letter-spacing:3px;font-weight:900;text-transform:uppercase;color:#3a4152}

@media(max-width:600px){
  .demo-banner{font-size:11px;padding:8px 12px}
  .demo-banner a{padding:5px 10px;font-size:10px}
  header{padding:36px 16px 24px}
  .logo{width:72px;height:72px;font-size:34px}
  .service-row{flex-direction:column;align-items:stretch;padding:16px}
  .svc-right{flex-direction:row;justify-content:space-between;align-items:center;width:100%}
  .cat-btn{padding:9px 15px;font-size:11px}
}
</style>
</head>
<body>

<!-- DEMO BANNER -->
<div class="demo-banner" id="demoBanner">
  <div class="demo-banner-txt">
    <span class="dot"></span>
    <span>Live Demo · by VAAN Consultancy</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <a href="https://wa.me/919671163712?text=Hi%20VAAN%2C%20I%20want%20a%20QR%20service%20menu%20like%20this%20for%20my%20salon." target="_blank">Get This →</a>
    <button class="close" onclick="document.getElementById('demoBanner').style.display='none'">✕</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">💇</div>
  <h1 class="brand" id="salonName">VAA <span class="gold">Salons</span></h1>
  <div class="tagline" id="salonTagline">Look Good · Feel Great</div>
  <div class="status" id="salonStatus">Open Now · 10 AM – 9 PM</div>
  <div class="meta">
    <span id="salonAddress">📍 Sector 12, Karnal</span>
    <span id="salonPhone">📞 9671163712</span>
  </div>
  <a class="instagram-btn" id="instagramBtn" href="https://instagram.com/vaa_enterprises" target="_blank">📸 Follow on Instagram</a>
</header>

<!-- FILTERS -->
<div class="filters-sticky">
  <div class="filters-row" id="catFilters">
    <!-- Category buttons rendered by JS -->
  </div>
</div>

<!-- MAIN -->
<main id="main">
  <div class="loading-state"><div class="spinner"></div>Loading services...</div>
</main>

<!-- FOOTER -->
<footer>
  <div><b>VAA Salons</b> — Demo</div>
  <div style="margin-top:6px">Transparent prices. Book directly on WhatsApp.</div>
  <div class="powered">Powered by <a href="../index.html">VAAN Consultancy</a></div>
</footer>

<!-- BOTTOM BAR -->
<div class="bottom-bar" id="bottomBar">
  <a class="call" id="callBtn" href="tel:9671163712">📞 Call</a>
  <a class="wa" id="waBtn" href="https://wa.me/919671163712" target="_blank">💬 Chat on WhatsApp</a>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   VAA SALONS DEMO — SCRIPT
   ========================================================== */
const SUPABASE_URL = "https://xvtxpllmfwgnlrffbcqz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2dHhwbGxtZndnbmxyZmZiY3F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0Mzg2OTYsImV4cCI6MjEwNjAxNDY5Nn0.JC1Za7PdNGLngpupBovq_DqI-vHRVBOovLdEe-w1Ap0";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allServices = [];
let salonInfo = null;
let currentCat = "all";

const CAT_ICONS = {
  "Hair": "💇",
  "Beauty": "💅",
  "Grooming": "🧔",
  "Spa": "💆"
};

function esc(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function formatPrice(n){ return "₹" + Number(n||0).toLocaleString("en-IN"); }

/* ====== LOAD ALL ====== */
async function loadAll(){
  try {
    const [servicesRes, infoRes] = await Promise.all([
      sb.from("vaa_salon_services").select("*").eq("is_available", true).order("display_order", { ascending: true }),
      sb.from("vaa_salon_info").select("*").limit(1)
    ]);

    if (servicesRes.error) throw servicesRes.error;
    if (infoRes.error) throw infoRes.error;

    allServices = servicesRes.data || [];
    salonInfo = (infoRes.data && infoRes.data[0]) || null;

    if (salonInfo){
      document.getElementById("salonName").innerHTML = (salonInfo.salon_name || "VAA Salons").replace("Salons", "<span class='gold'>Salons</span>");
      document.getElementById("salonTagline").textContent = salonInfo.tagline || "Look Good · Feel Great";
      document.getElementById("salonStatus").textContent = "Open Now · " + (salonInfo.hours || "10 AM – 9 PM");
      document.getElementById("salonAddress").textContent = "📍 " + (salonInfo.address || "Sector 12, Karnal");
      document.getElementById("salonPhone").textContent = "📞 " + (salonInfo.phone || "9671163712");
      document.getElementById("callBtn").href = "tel:" + (salonInfo.phone || "9671163712");
      document.getElementById("waBtn").href = "https://wa.me/" + (salonInfo.whatsapp || "919671163712");
      const igBtn = document.getElementById("instagramBtn");
      if (igBtn && salonInfo.instagram){
        const handle = salonInfo.instagram.replace("@", "");
        igBtn.href = "https://instagram.com/" + handle;
        igBtn.textContent = "📸 " + salonInfo.instagram;
      }
    }

    buildCategoryFilters();
    renderServices();
  } catch (err){
    console.error(err);
    document.getElementById("main").innerHTML = '<div class="loading-state">⚠️ Could not load services. Please refresh.</div>';
  }
}

/* ====== BUILD CATEGORY FILTERS ====== */
function buildCategoryFilters(){
  const cats = [...new Set(allServices.map(s => s.category))];
  const wrap = document.getElementById("catFilters");
  const btns = ['<button class="cat-btn active" data-cat="all" onclick="setCat(\'all\', this)">✨ All</button>'];
  cats.forEach(c => {
    const icon = CAT_ICONS[c] || "💫";
    btns.push('<button class="cat-btn" data-cat="' + esc(c) + '" onclick="setCat(\'' + esc(c).replace(/'/g, "\\'") + '\', this)">' + icon + ' ' + esc(c) + '</button>');
  });
  wrap.innerHTML = btns.join("");
}

function setCat(cat, btn){
  currentCat = cat;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderServices();
}

/* ====== RENDER SERVICES ====== */
function renderServices(){
  const main = document.getElementById("main");

  let items = allServices.slice();
  if (currentCat !== "all") items = items.filter(s => s.category === currentCat);

  if (items.length === 0){
    main.innerHTML = '<div class="loading-state">No services in this category.</div>';
    return;
  }

  const grouped = {};
  items.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });

  const html = Object.keys(grouped).map(cat => {
    const catItems = grouped[cat];
    const icon = CAT_ICONS[cat] || "💫";
    return '<div class="cat-section">' +
      '<div class="cat-header">' +
        '<span class="icon">' + icon + '</span>' +
        '<h2>' + esc(cat) + '</h2>' +
        '<span class="count">' + catItems.length + '</span>' +
        '<div class="line"></div>' +
      '</div>' +
      '<div class="service-list">' +
        catItems.map(s => renderServiceRow(s)).join("") +
      '</div>' +
    '</div>';
  }).join("");

  main.innerHTML = html;
}

function renderServiceRow(s){
  const waNumber = salonInfo?.whatsapp || "919671163712";
  const waText = encodeURIComponent("Hi, I want to book " + s.service_name + " (" + formatPrice(s.price) + ", " + (s.duration || "as per availability") + ") at VAA Salons. When can I come?");

  return '<div class="service-row' + (s.is_bestseller ? ' bestseller' : '') + '">' +
    '<div class="svc-info">' +
      '<div class="svc-name">' + esc(s.service_name) + '</div>' +
      (s.description ? '<div class="svc-desc">' + esc(s.description) + '</div>' : '') +
      '<div class="svc-meta">' +
        (s.duration ? '<span class="duration">⏱ ' + esc(s.duration) + '</span>' : '') +
        '<span>' + esc(s.category) + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="svc-right">' +
      '<div class="svc-price">' + formatPrice(s.price) + '</div>' +
      '<button class="svc-book" onclick="bookService(\'' + esc(s.service_name).replace(/'/g, "\\'") + '\',' + s.price + ',\'' + esc(s.duration || "").replace(/'/g, "\\'") + '\')">📅 Book</button>' +
    '</div>' +
  '</div>';
}

/* ====== BOOK SERVICE (WhatsApp) ====== */
function bookService(name, price, duration){
  const waNumber = salonInfo?.whatsapp || "919671163712";
  const msg = "Hi, I want to book *" + name + "* (" + formatPrice(price) + (duration ? ", " + duration : "") + ") at VAA Salons. Please confirm availability.";
  const url = "https://wa.me/" + waNumber + "?text=" + encodeURIComponent(msg);
  window.open(url, "_blank");
}

/* ====== INIT ====== */
loadAll();
</script>

</body>
  </html>
