<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAA Hotels — Room Concierge</title>
<meta name="description" content="VAA Hotels — your complete in-room guide. WiFi, timings, room service, and nearby places.">
<meta name="theme-color" content="#0a0e1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,Arial,sans-serif;background:#0a0e1a;color:#f5f5f5;-webkit-tap-highlight-color:transparent;line-height:1.55;padding-top:44px;padding-bottom:40px}
a{text-decoration:none;color:inherit}
:root{--gold:#ffd400;--gold-2:#e6b800;--blue:#4f8fff;--card:#12192a;--card-2:#0d1220;--line:rgba(255,212,0,.15);--line-soft:rgba(255,255,255,.08);--white:#f5f5f5;--muted:#8a8f9c;--green:#25b46e}

/* DEMO BANNER */
.demo-banner{position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(90deg,#ffd400,#ffa726);color:#0a0e1a;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;font-weight:850}
.demo-banner-txt{display:flex;align-items:center;gap:8px}
.demo-banner .dot{width:8px;height:8px;background:#0a0e1a;border-radius:50%;animation:pulseDot 1.5s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.4}}
.demo-banner a{background:#0a0e1a;color:var(--gold);padding:6px 12px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.5px;white-space:nowrap}
.demo-banner .close{background:transparent;border:0;color:#0a0e1a;font-size:18px;cursor:pointer;padding:2px 6px;font-weight:900}

/* HEADER */
header{padding:40px 20px 30px;text-align:center;position:relative;border-bottom:1px solid var(--line-soft);background:radial-gradient(ellipse at 50% 0%,rgba(255,212,0,.1),transparent 60%),#0a0e1a}
.logo{width:80px;height:80px;margin:0 auto 16px;border-radius:22px;background:linear-gradient(145deg,#1a2136,#0d1220);border:2px solid rgba(255,212,0,.4);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 0 40px rgba(255,212,0,.2)}
.brand{font-size:clamp(28px,5vw,40px);font-weight:950;letter-spacing:-1.5px;line-height:1;color:var(--white)}
.brand .gold{color:var(--gold)}
.tagline{color:var(--muted);font-size:11px;letter-spacing:3px;font-weight:900;margin-top:10px;text-transform:uppercase}

/* WELCOME STRIP */
.welcome{margin:24px auto 0;max-width:900px;padding:0 20px}
.welcome-card{background:linear-gradient(145deg,#1a2136,#12192a);border:1px solid rgba(255,212,0,.3);border-radius:20px;padding:24px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.welcome-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold),var(--blue))}
.welcome-icon{width:56px;height:56px;border-radius:14px;background:var(--gold);color:#0a0e1a;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.welcome-info{flex:1;min-width:0}
.welcome-info .small{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;margin-bottom:4px}
.welcome-info .big{font-size:22px;font-weight:950;letter-spacing:-.5px}
.welcome-info .room{color:var(--gold);font-size:13px;font-weight:850;margin-top:4px;letter-spacing:.5px}

/* MAIN */
main{max-width:900px;margin:0 auto;padding:36px 20px 0}
.section{margin-bottom:36px}
.section-label{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:12px;letter-spacing:3px;font-weight:900;color:var(--gold);text-transform:uppercase}
.section-label::before{content:"";width:4px;height:16px;background:var(--gold);border-radius:2px}

/* WIFI CARD */
.wifi-card{background:linear-gradient(135deg,#1a2136,#0d1220);border:1px solid rgba(79,143,255,.3);border-radius:18px;padding:22px;position:relative;overflow:hidden}
.wifi-card::after{content:"";position:absolute;top:0;right:0;width:120px;height:120px;background:radial-gradient(circle,rgba(79,143,255,.15),transparent 70%);pointer-events:none}
.wifi-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.wifi-row:last-child{border-bottom:0}
.wifi-row .label{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900}
.wifi-row .value{font-size:15px;font-weight:850;color:var(--white);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wifi-row .value code{background:rgba(255,212,0,.15);color:var(--gold);padding:5px 12px;border-radius:8px;font-family:'Courier New',monospace;font-weight:800;letter-spacing:1px;font-size:14px}
.copy-btn{background:rgba(255,255,255,.06);border:1px solid var(--line-soft);color:var(--white);padding:6px 12px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;transition:.2s}
.copy-btn:hover{border-color:var(--gold);color:var(--gold)}

/* TIMINGS GRID */
.timings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.timing-card{background:var(--card);border:1px solid var(--line-soft);border-radius:16px;padding:20px 16px;text-align:center;transition:.25s}
.timing-card:hover{border-color:rgba(255,212,0,.35);transform:translateY(-3px)}
.timing-icon{font-size:30px;margin-bottom:10px;display:block}
.timing-label{color:var(--muted);font-size:10px;letter-spacing:2px;font-weight:900;text-transform:uppercase;margin-bottom:6px}
.timing-time{font-size:14px;font-weight:850;color:var(--white);letter-spacing:-.3px}

/* SERVICES GRID */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.service-card{background:var(--card);border:1px solid var(--line-soft);border-radius:16px;padding:22px 14px;text-align:center;text-decoration:none;transition:.25s;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer}
.service-card:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 12px 30px rgba(255,212,0,.15)}
.service-icon{font-size:34px}
.service-label{font-size:12px;font-weight:850;letter-spacing:-.2px}
.service-sub{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.service-num{font-size:22px;font-weight:950;color:var(--gold);letter-spacing:-1px}

/* NEARBY LIST */
.nearby-list{display:grid;gap:10px}
.nearby-item{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;transition:.25s;text-decoration:none}
.nearby-item:hover{border-color:rgba(255,212,0,.4);transform:translateX(4px)}
.nearby-item .icon{font-size:22px;flex-shrink:0}
.nearby-info{flex:1;min-width:0}
.nearby-name{font-size:14px;font-weight:850;letter-spacing:-.3px}
.nearby-distance{color:var(--muted);font-size:11px;font-weight:700;margin-top:3px;letter-spacing:.5px}
.nearby-arrow{color:var(--gold);font-size:18px;flex-shrink:0}

/* OFFERS */
.offers-list{display:grid;gap:10px}
.offer-card{background:linear-gradient(135deg,#1a2136,#12192a);border:1px solid rgba(255,212,0,.25);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden}
.offer-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.offer-title{font-size:15px;font-weight:900;letter-spacing:-.3px;margin-bottom:6px;color:var(--gold)}
.offer-desc{color:#c8cdd8;font-size:13px;line-height:1.55}

/* EMERGENCY */
.emergency-card{background:linear-gradient(135deg,rgba(225,29,42,.15),rgba(255,107,53,.08));border:2px solid var(--red,#e11d2a);border-radius:18px;padding:22px;text-align:center}
.emergency-card .ico{font-size:32px;margin-bottom:8px;display:block}
.emergency-card h3{margin:0 0 8px;font-size:16px;color:#ff6b7a;text-transform:uppercase;letter-spacing:1.5px;font-weight:950}
.emergency-card a{display:inline-block;background:var(--red,#e11d2a);color:white;padding:12px 24px;border-radius:12px;font-weight:900;font-size:14px;letter-spacing:1.5px;text-decoration:none;margin-top:12px}
.emergency-card a:hover{transform:scale(1.03)}

/* FOOTER */
footer{text-align:center;padding:50px 20px 30px;color:var(--muted);font-size:11px;line-height:1.7;border-top:1px solid var(--line-soft);margin-top:50px}
footer b{color:var(--gold)}
footer a{color:var(--gold);border-bottom:1px solid rgba(255,212,0,.4)}
footer .powered{margin-top:12px;font-size:10px;letter-spacing:3px;font-weight:900;text-transform:uppercase;color:#3a4152}

/* LANGUAGE TOGGLE */
.lang-toggle{position:fixed;top:60px;right:16px;z-index:100;background:rgba(10,14,26,.9);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:99px;padding:4px;display:flex;gap:2px}
.lang-toggle button{background:transparent;border:0;color:var(--muted);padding:6px 12px;border-radius:99px;font-weight:900;font-size:11px;font-family:inherit;cursor:pointer;transition:.2s;letter-spacing:1px}
.lang-toggle button.active{background:var(--gold);color:#0a0e1a}

@media(max-width:600px){
  .demo-banner{font-size:11px;padding:8px 12px}
  .demo-banner a{padding:5px 10px;font-size:10px}
  header{padding:32px 16px 24px}
  .logo{width:68px;height:68px;font-size:32px;border-radius:18px}
  .welcome-card{padding:18px}
  .welcome-icon{width:48px;height:48px;font-size:22px}
  .welcome-info .big{font-size:18px}
  .timings-grid,.services-grid{grid-template-columns:1fr 1fr}
  .lang-toggle{top:56px;right:8px}
  .lang-toggle button{padding:5px 10px;font-size:10px}
}
</style>
</head>
<body>

<!-- DEMO BANNER -->
<div class="demo-banner" id="demoBanner">
  <div class="demo-banner-txt">
    <span class="dot"></span>
    <span>Live Demo · by VAAN Consultancy</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <a href="https://wa.me/919671163712?text=Hi%20VAAN%2C%20I%20want%20a%20hotel%20room%20concierge%20system%20like%20this." target="_blank">Get This →</a>
    <button class="close" onclick="document.getElementById('demoBanner').style.display='none'">✕</button>
  </div>
</div>

<!-- LANGUAGE TOGGLE -->
<div class="lang-toggle">
  <button class="active" data-lang="en" onclick="setLang('en')">EN</button>

</div>

<!-- HEADER -->
<header>

  <h1 class="brand" id="hotelName">VAA <span class="gold">Hotels</span></h1>

<div class="welcome">

    <div class="welcome-info">
      <div class="small">Welcome</div>

<!-- MAIN -->
<main id="main">
  <div style="padding:60px 20px;text-align:center;color:var(--muted)">
    <div style="width:44px;height:44px;border:3px solid rgba(255,212,0,.1);border-top-color:#ffd400;border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite"></div>
    Loading...
  </div>
</main>

<!-- FOOTER -->
<footer>
  <div><b>VAA Hotels</b> — Demo</div>
  <div style="margin-top:6px">Live demo of an in-room QR concierge system</div>
  <div class="powered">Powered by <a href="../index.html">VAAN Consultancy</a></div>
</footer>

<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   VAA HOTELS DEMO — SCRIPT
   ========================================================== */
const SUPABASE_URL = "https://xvtxpllmfwgnlrffbcqz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2dHhwbGxtZndnbmxyZmZiY3F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0Mzg2OTYsImV4cCI6MjEwNjAxNDY5Nn0.JC1Za7PdNGLngpupBovq_DqI-vHRVBOovLdEe-w1Ap0";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let hotelInfo = null;
let nearbyPlaces = [];
let offers = [];
let currentLang = "en";

const TRANSLATIONS = {
  en: {
    wifiTitle: "Wi-Fi Access",
    wifiNetwork: "Network",
    wifiPassword: "Password",
    copy: "Copy",
    copied: "Copied!",
    mealTimings: "Meal Timings",
    breakfast: "Breakfast",
    lunch: "Lunch",
    dinner: "Dinner",
    checkin: "Check-in",
    checkout: "Check-out",
    roomServices: "Room Services",
    roomService: "Room Service",
    reception: "Reception",
    housekeeping: "Housekeeping",
    dial: "Dial",
    nearbyPlaces: "Nearby Places",
    viewOnMaps: "View on Maps",
    specialOffers: "Special Offers",
    emergency: "Emergency",
    callEmergency: "Call 112",
    emergencyText: "For any emergency, dial 112 immediately or contact reception (Dial 0)."
  },
  hi: {
    wifiTitle: "वाई-फाई एक्सेस",
    wifiNetwork: "नेटवर्क",
    wifiPassword: "पासवर्ड",
    copy: "कॉपी",
    copied: "कॉपी हो गया!",
    mealTimings: "भोजन का समय",
    breakfast: "नाश्ता",
    lunch: "दोपहर का भोजन",
    dinner: "रात का खाना",
    checkin: "चेक-इन",
    checkout: "चेक-आउट",
    roomServices: "रूम सेवाएं",
    roomService: "रूम सर्विस",
    reception: "रिसेप्शन",
    housekeeping: "हाउसकीपिंग",
    dial: "डायल",
    nearbyPlaces: "आस-पास की जगहें",
    viewOnMaps: "मैप्स पर देखें",
    specialOffers: "विशेष ऑफर",
    emergency: "आपातकाल",
    callEmergency: "112 पर कॉल करें",
    emergencyText: "किसी भी आपात स्थिति के लिए तुरंत 112 डायल करें या रिसेप्शन से संपर्क करें (0 डायल करें)।"
  }
};

function esc(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function t(key){ return TRANSLATIONS[currentLang][key] || TRANSLATIONS.en[key] || key; }

/* ====== LOAD ALL ====== */
async function loadAll(){
  try {
    const [infoRes, nearbyRes, offersRes] = await Promise.all([
      sb.from("vaa_hotel_info").select("*").limit(1),
      sb.from("vaa_hotel_nearby").select("*").eq("active", true).order("display_order", { ascending: true }),
      sb.from("vaa_hotel_offers").select("*").eq("active", true).order("display_order", { ascending: true })
    ]);

    if (infoRes.error) throw infoRes.error;
    if (nearbyRes.error) throw nearbyRes.error;
    if (offersRes.error) throw offersRes.error;

    hotelInfo = (infoRes.data && infoRes.data[0]) || null;
    nearbyPlaces = nearbyRes.data || [];
    offers = offersRes.data || [];

    updateHeader();
    renderAll();
  } catch (err){
    console.error(err);
    document.getElementById("main").innerHTML = '<div style="padding:60px 20px;text-align:center;color:#8a8f9c">⚠️ Could not load hotel info. Please refresh.</div>';
  }
}

/* ====== HEADER UPDATE ====== */
function updateHeader(){
  if (!hotelInfo) return;
  document.getElementById("hotelName").innerHTML = (hotelInfo.hotel_name || "VAA Hotels").replace("Hotels", "<span class='gold'>Hotels</span>");
  document.getElementById("hotelTagline").textContent = hotelInfo.tagline || "Your Stay, Simplified";
  document.getElementById("guestName").textContent = hotelInfo.guest_name || "Guest";
  document.getElementById("roomNumber").textContent = "📍 Room " + (hotelInfo.room_number || "302");
}

/* ====== RENDER ALL ====== */
function renderAll(){
  if (!hotelInfo) return;
  const main = document.getElementById("main");

  let html = "";

  /* 1. WIFI */
  html += '<div class="section">';
  html += '<div class="section-label">📶 ' + t("wifiTitle") + '</div>';
  html += '<div class="wifi-card">';
  html += '<div class="wifi-row"><span class="label">' + t("wifiNetwork") + '</span><span class="value">' + esc(hotelInfo.wifi_name) + '</span></div>';
  html += '<div class="wifi-row"><span class="label">' + t("wifiPassword") + '</span><span class="value"><code id="wifiPass">' + esc(hotelInfo.wifi_password) + '</code><button class="copy-btn" onclick="copyPassword()">' + t("copy") + '</button></span></div>';
  html += '</div></div>';

  /* 2. MEAL TIMINGS */
  html += '<div class="section">';
  html += '<div class="section-label">🍽️ ' + t("mealTimings") + '</div>';
  html += '<div class="timings-grid">';
  html += '<div class="timing-card"><span class="timing-icon">🌅</span><div class="timing-label">' + t("breakfast") + '</div><div class="timing-time">' + esc(hotelInfo.breakfast_time) + '</div></div>';
  html += '<div class="timing-card"><span class="timing-icon">☀️</span><div class="timing-label">' + t("lunch") + '</div><div class="timing-time">' + esc(hotelInfo.lunch_time) + '</div></div>';
  html += '<div class="timing-card"><span class="timing-icon">🌙</span><div class="timing-label">' + t("dinner") + '</div><div class="timing-time">' + esc(hotelInfo.dinner_time) + '</div></div>';
  html += '<div class="timing-card"><span class="timing-icon">🛎️</span><div class="timing-label">' + t("checkin") + '</div><div class="timing-time">' + esc(hotelInfo.checkin_time) + '</div></div>';
  html += '<div class="timing-card"><span class="timing-icon">🚪</span><div class="timing-label">' + t("checkout") + '</div><div class="timing-time">' + esc(hotelInfo.checkout_time) + '</div></div>';
  html += '</div></div>';

  /* 3. ROOM SERVICES */
  html += '<div class="section">';
  html += '<div class="section-label">🛎️ ' + t("roomServices") + '</div>';
  html += '<div class="services-grid">';
  html += '<a class="service-card" href="tel:' + esc(hotelInfo.room_service_phone) + '"><span class="service-icon">🍽️</span><div class="service-label">' + t("roomService") + '</div><div class="service-num">' + esc(hotelInfo.room_service_phone) + '</div></a>';
  html += '<a class="service-card" href="tel:' + esc(hotelInfo.reception_phone) + '"><span class="service-icon">🛎️</span><div class="service-label">' + t("reception") + '</div><div class="service-num">' + esc(hotelInfo.reception_phone) + '</div></a>';
  html += '<a class="service-card" href="tel:' + esc(hotelInfo.housekeeping_phone) + '"><span class="service-icon">🧹</span><div class="service-label">' + t("housekeeping") + '</div><div class="service-num">' + esc(hotelInfo.housekeeping_phone) + '</div></a>';
  html += '</div>';
  html += '<p style="color:#8a8f9c;font-size:12px;text-align:center;margin-top:12px;line-height:1.5">' + t("dial") + ' the number from your room phone. On mobile, tap to call directly.</p>';
  html += '</div>';

  /* 4. NEARBY PLACES */
  if (nearbyPlaces.length > 0){
    html += '<div class="section">';
    html += '<div class="section-label">📍 ' + t("nearbyPlaces") + '</div>';
    html += '<div class="nearby-list">';
    html += nearbyPlaces.map(p => {
      const maps = p.maps_url || hotelInfo.google_maps_url || "#";
      return '<a class="nearby-item" href="' + esc(maps) + '" target="_blank">' +
        '<span class="icon">' + esc(p.category || "📍") + '</span>' +
        '<div class="nearby-info">' +
          '<div class="nearby-name">' + esc(p.name) + '</div>' +
          '<div class="nearby-distance">' + esc(p.distance || "") + '</div>' +
        '</div>' +
        '<span class="nearby-arrow">→</span>' +
      '</a>';
    }).join("");
    html += '</div></div>';
  }

  /* 5. OFFERS */
  if (offers.length > 0){
    html += '<div class="section">';
    html += '<div class="section-label">🎁 ' + t("specialOffers") + '</div>';
    html += '<div class="offers-list">';
    html += offers.map(o =>
      '<div class="offer-card">' +
        '<div class="offer-title">' + esc(o.title) + '</div>' +
        (o.description ? '<div class="offer-desc">' + esc(o.description) + '</div>' : '') +
      '</div>'
    ).join("");
    html += '</div></div>';
  }

  /* 6. EMERGENCY */
  html += '<div class="section">';
  html += '<div class="section-label">🚨 ' + t("emergency") + '</div>';
  html += '<div class="emergency-card">';
  html += '<span class="ico">🚨</span>';
  html += '<h3>' + t("emergency") + '</h3>';
  html += '<p style="color:#c8cdd8;font-size:13px;line-height:1.55;margin:0">' + t("emergencyText") + '</p>';
  html += '<a href="tel:' + esc(hotelInfo.emergency_number) + '">' + t("callEmergency") + '</a>';
  html += '</div></div>';

  main.innerHTML = html;
}

/* ====== COPY WIFI PASSWORD ====== */
function copyPassword(){
  const pass = hotelInfo?.wifi_password || "";
  if (navigator.clipboard){
    navigator.clipboard.writeText(pass).then(() => {
      const btn = event.target;
      const original = btn.textContent;
      btn.textContent = t("copied");
      btn.style.color = "var(--gold)";
      setTimeout(() => { btn.textContent = original; btn.style.color = ""; }, 1500);
    });
  } else {
    alert("WiFi Password: " + pass);
  }
}

/* ====== LANGUAGE TOGGLE ====== */
function setLang(lang){
  currentLang = lang;
  document.querySelectorAll(".lang-toggle button").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  renderAll();
}

/* ====== INIT ====== */
loadAll();
</script>
